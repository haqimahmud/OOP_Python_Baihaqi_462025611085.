<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMB UNIDA Gontor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        /* Kode warna biru presisi sesuai tombol 'Data Prodi' di gambar kamu */
        .bg-custom-blue {
            background-color: #3178C6 !important;
        }
        .text-custom-blue {
            color: #3178C6 !important;
        }
        .btn-custom-blue {
            background-color: #3178C6 !important;
            color: white !important;
            border: none !important;
        }
        .btn-custom-blue:hover {
            background-color: #265f9e !important; /* Efek gelap sedikit saat kursor menempel */
            color: white !important;
        }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-custom-blue shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">PMB UNIDA GONTOR</a>
            <div>
                <a class="btn btn-outline-light me-2" href="/pendaftaran">Daftar</a>
                <a class="btn btn-outline-light me-2" href="/status">Cek Status</a>
                <a class="btn btn-warning fw-bold" href="/login">Login Admin</a>
            </div>
        </div>
    </nav>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
